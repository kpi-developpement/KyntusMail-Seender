# ===============================
# DATABASE CONFIGURATION (MailOS - Prod/Docker)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.10.10.50:5432/mailingdb?reWriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kyntus_user}
# Aucun secret en dur : la valeur vient de l'environnement (fichier .env / docker-compose).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# THROTTLING (Risk Management - Pour ne pas saturer les connexions)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ===============================
# HIBERNATE & JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGS & PERFORMANCE OPTIMIZATION
# ===============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR

# ===============================
# SERVER CONFIGURATION & TIMEOUTS
# ===============================
server.port=${SERVER_PORT:4778}
server.tomcat.connection-timeout=120000
server.tomcat.max-threads=50
server.tomcat.accept-count=100
# On ne publie pas la version du serveur ni les traces d'erreur au client.
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.max-swallow-size=-1

# ===============================
# MULTIPART / UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:60MB}

# ===============================
# OMNI SEARCH & JSON FIXES
# ===============================
server.tomcat.max-http-form-post-size=-1
spring.jackson.default-property-inclusion=non_null

# ===============================
# MAIL CONFIGURATION (IONOS)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.ionos.fr}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:communication.bytel@kyntus.com}
# Aucun secret en dur : voir .env.example
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# TLS moderne uniquement + vérification du certificat du serveur SMTP (anti interception).
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.ionos.fr}
# Timeouts : une connexion qui pend bloquerait toute la file d'envoi.
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Une seule connexion SMTP réutilisée, jamais de rafale parallèle.
spring.mail.properties.mail.smtp.quitwait=true

# ===============================
# ANTI-BAN / DELIVRABILITE
# ===============================
# Expediteur (doit etre couvert par le SPF et le DKIM du domaine kyntus.com)
kyntus.mail.from=${MAIL_USERNAME:communication.bytel@kyntus.com}
kyntus.mail.from-name=${MAIL_FROM_NAME:Kyntus}
kyntus.mail.reply-to=${MAIL_REPLY_TO:}
# Destinataires toujours ajoutes en copie
kyntus.mail.default-cc=${MAIL_DEFAULT_CC:zouheir.belhouji@kyntus.com}
# Adresse de desinscription (entete List-Unsubscribe). Vide = entete omise.
kyntus.mail.unsubscribe-mailto=${MAIL_UNSUBSCRIBE:}
kyntus.mail.message-id-domain=${MAIL_MESSAGE_ID_DOMAIN:kyntus.com}
# Rythme d'envoi : 1 message toutes les 20 a 45 secondes, 60 par heure maximum
kyntus.mail.max-per-hour=${MAIL_MAX_PER_HOUR:60}
kyntus.mail.min-delay-ms=${MAIL_MIN_DELAY_MS:20000}
kyntus.mail.max-delay-ms=${MAIL_MAX_DELAY_MS:45000}
kyntus.mail.max-attempts=${MAIL_MAX_ATTEMPTS:3}
kyntus.mail.max-cc=${MAIL_MAX_CC:25}
kyntus.mail.max-upload-bytes=${MAIL_MAX_UPLOAD_BYTES:26214400}

# ===============================
# CORS (origines autorisees du front)
# ===============================
kyntus.cors.allowed-origins=${KYNTUS_CORS_ALLOWED_ORIGINS:http://10.10.10.25:1193,http://localhost:1193,http://localhost:3000}
